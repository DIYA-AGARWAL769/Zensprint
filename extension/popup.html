<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 240px;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        background: #09090b;
        color: #fafafa;
        margin: 0;
        padding: 16px;
        text-align: left;
      }
      .badge {
        display: inline-block;
        background: rgba(13, 148, 136, 0.1);
        border: 1px solid rgba(13, 148, 136, 0.2);
        color: #2dd4bf;
        font-size: 9px;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 9999px;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      h3 {
        margin: 0 0 6px 0;
        font-size: 15px;
        color: #ffffff;
        font-weight: 800;
      }
      p {
        font-size: 11px;
        color: #a1a1aa;
        margin: 0 0 14px 0;
        line-height: 1.4;
      }
      .form-group {
        margin-bottom: 12px;
        text-align: left;
      }
      label {
        display: block;
        font-size: 10px;
        font-weight: bold;
        color: #a1a1aa;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #18181b;
        border: 1px solid #27272a;
        color: white;
        padding: 8px 10px;
        font-size: 11px;
        border-radius: 6px;
        outline: none;
      }
      input:focus {
        border-color: #0d9488;
      }
      .btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        background: #0d9488;
        color: white;
        border: none;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #0f766e;
      }
      #status {
        font-size: 10px;
        margin-top: 8px;
        font-weight: bold;
        text-align: center;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="badge">Shield Active</div>
    </div>
    <h3>ZenSprint Focus Cop</h3>
    <p>Redirection Blocker is currently active. Stay away from social media!</p>
    
    <div class="form-group">
      <label for="urlInput">ZenSprint Dashboard URL</label>
      <input type="text" id="urlInput" value="https://zensprint-vy33.vercel.app" readonly />
    </div>
    <p style="margin-bottom: 0;">Connected to the official ZenSprint dashboard.</p>

    <script src="popup.js"></script>
  </body>
</html>
